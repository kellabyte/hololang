# The holo executable delegates language work to the single compiler library.
# Root integration tests are attached here so Cargo supplies CARGO_BIN_EXE_holo
# and runs each shared test once; no conformance suite is lost at the virtual root.
[package]
name = "holo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface to the experimental Holo compiler"
default-run = "holo"
autotests = false

[dependencies]
holo = { package = "holo-compiler", path = "../compiler" }

# tests/compiler/frontend

[[test]]
name = "lex"
path = "../tests/compiler/frontend/lex.rs"

[[test]]
name = "parser"
path = "../tests/compiler/frontend/parser.rs"

[[test]]
name = "frontend"
